name: Build Optional CPython Dependencies for Android aarch64 (API 35)

on:
  workflow_dispatch:
  push:
    branches:
      - 'Tru'

jobs:
  build-optional-deps-aarch64:
    runs-on: macos-14
    permissions:
      contents: write

    env:
      API_LEVEL: 35
      ARCH: aarch64
      NDK_VERSION: 29.0.14206865
      PREFIX: /opt/android-optional-deps-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p $HOME/android/cmdline-tools
          cd $HOME/android/cmdline-tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept licenses and install SDK/NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-${{ env.API_LEVEL }}" "platform-tools" "ndk;${{ env.NDK_VERSION }}"

      - name: Set NDK variables
        run: |
          echo "NDK_ROOT=${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "TOOLCHAIN=${{ env.NDK_ROOT }}/toolchains/llvm/prebuilt/darwin-x86_64" >> $GITHUB_ENV

      - name: Create cross-compile environment script
        run: |
          cat << 'EOF' > cross-env.sh
          export CC=${{ env.TOOLCHAIN }}/bin/${{ env.ARCH }}-linux-android${{ env.API_LEVEL }}-clang
          export CXX=${{ env.TOOLCHAIN }}/bin/${{ env.ARCH }}-linux-android${{ env.API_LEVEL }}-clang++
          export AR=${{ env.TOOLCHAIN }}/bin/llvm-ar
          export RANLIB=${{ env.TOOLCHAIN }}/bin/llvm-ranlib
          export STRIP=${{ env.TOOLCHAIN }}/bin/llvm-strip
          export CFLAGS="-O3 -fPIC"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L${{ env.NDK_ROOT }}/sources/cxx-stl/llvm-libc++/libs/${{ env.ARCH }}-linux-android"
          EOF
          chmod +x cross-env.sh

      - name: Build libuuid (for _uuid)
        run: |
          source cross-env.sh
          curl -L -o util-linux.tar.gz https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.41/util-linux-2.41.1.tar.gz
          tar xzf util-linux.tar.gz
          cd util-linux-*
          ./configure --host=${{ env.ARCH }}-linux-android --prefix=${{ env.PREFIX }} --disable-all-programs --enable-libuuid --disable-shared
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: Build gdbm (for _gdbm and _dbm)
        run: |
          source cross-env.sh
          curl -L -o gdbm.tar.gz https://ftp.gnu.org/gnu/gdbm/gdbm-1.26.tar.gz
          tar xzf gdbm.tar.gz
          cd gdbm-*
          ./configure --host=${{ env.ARCH }}-linux-android --prefix=${{ env.PREFIX }} --enable-libgdbm-compat --disable-shared
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: Build ncursesw (for _curses and _curses_panel)
        run: |
          source cross-env.sh
          curl -L -o ncurses.tar.gz https://invisible-mirror.net/archives/ncurses/ncurses-6.5.tar.gz
          tar xzf ncurses.tar.gz
          cd ncurses-*
          ./configure --host=${{ env.ARCH }}-linux-android --prefix=${{ env.PREFIX }} \
                      --with-termlib --enable-widec --without-debug --without-tests \
                      --disable-shared --with-normal
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: Build readline (for readline module)
        run: |
          source cross-env.sh
          export CPPFLAGS="-I${{ env.PREFIX }}/include -I${{ env.PREFIX }}/include/ncursesw"
          export LDFLAGS="-L${{ env.PREFIX }}/lib"
          curl -L -o readline.tar.gz https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz
          tar xzf readline.tar.gz
          cd readline-*
          ./configure --host=${{ env.ARCH }}-linux-android --prefix=${{ env.PREFIX }} \
                      --with-curses --disable-shared
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: Package dependencies
        run: |
          cd ${{ env.PREFIX }}/..
          tar -czf $GITHUB_WORKSPACE/android-optional-deps-aarch64-api35.tar.gz android-optional-deps-aarch64

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || 'optional-deps-aarch64-latest' }}
          release_name: Android aarch64 Optional CPython Dependencies (API 35)
          body: |
            Static dependencies enabling:
            - _uuid (libuuid from util-linux 2.41.1)
            - _gdbm / _dbm (gdbm 1.26 with compat)
            - _curses / _curses_panel (ncursesw 6.5)
            - readline (8.3)
            Built with NDK r29 on macOS 14.
            Note: ncurses/readline may require source patches for full Bionic compatibility.

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: android-optional-deps-aarch64-api35.tar.gz
          asset_name: android-optional-deps-aarch64-api35.tar.gz
          asset_content_type: application/gzip
